volumes:
  redis_data:

x-app-healthcheck: &app-healthcheck
  test:
    - CMD
    - python
    - -c
    - import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json', timeout=3)
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 10s

networks:
  backend_net:
  caddy_net:
    external: true

services:
  redis_db:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    mem_limit: 128m
    networks:
      - backend_net

  api_gateway:
    build: ./api_gateway
    restart: unless-stopped
    depends_on:
      redis_db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: 256m
    networks:
      - backend_net
      - caddy_net

  chatbot:
    build: ./chatbot
    restart: unless-stopped
    environment:
      PSTG_URL: ${PSTG_URL:?PSTG_URL is required}
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-1}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-2}
      COHERE_API_KEY: ${COHERE_API_KEY:?COHERE_API_KEY is required}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY is required}
      CHAT_FILE_ALLOWED_HOSTS: ${CHAT_FILE_ALLOWED_HOSTS:-ntnoptppvhvezqbdbcyl.supabase.co}
    healthcheck: *app-healthcheck
    mem_limit: 768m
    networks:
      - backend_net

  data_distributor:
    build: ./data_distributor
    restart: unless-stopped
    environment:
      PSTG_URL: ${PSTG_URL:?PSTG_URL is required}
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-1}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-2}
      APIFY: ${APIFY:?APIFY is required}
      CALLBACK_SECRET: ${CALLBACK_SECRET:?CALLBACK_SECRET is required}
      COHERE_API_KEY: ${COHERE_API_KEY:?COHERE_API_KEY is required}
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      SUPABASE_KEY: ${SUPABASE_KEY:?SUPABASE_KEY is required}
    healthcheck: *app-healthcheck
    mem_limit: 1024m
    networks:
      - backend_net

  processor:
    build:
      context: ./processor
      dockerfile: dockerfile
    restart: unless-stopped
    environment:
      CALLBACK_SECRET: ${CALLBACK_SECRET:?CALLBACK_SECRET is required}
      COHERE_API_KEY: ${COHERE_API_KEY:?COHERE_API_KEY is required}
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      SUPABASE_KEY: ${SUPABASE_KEY:?SUPABASE_KEY is required}
    healthcheck: *app-healthcheck
    mem_limit: 768m
    networks:
      - backend_net

  prompt_rewrite:
    build: ./prompt_rewrite
    restart: unless-stopped
    environment:
      PSTG_URL: ${PSTG_URL:?PSTG_URL is required}
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-1}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-2}
      OPEN_ROUTER: ${OPEN_ROUTER:?OPEN_ROUTER is required}
    healthcheck: *app-healthcheck
    mem_limit: 512m
    networks:
      - backend_net

  log-error_container:
    build: ./error_handler
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?TELEGRAM_CHAT_ID is required}
    healthcheck: *app-healthcheck
    mem_limit: 256m
    networks:
      - backend_net
